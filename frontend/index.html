<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>心理顾问 · Web App</title>
    <meta name="description" content="心理顾问 Web App · Phase 1 测评页(0910) + 情绪打卡页(0911)" />
    <style>
      :root {
        --psy-bg: #fafaf7;
        --psy-fg: #1f2937;
        --psy-muted: #6b7280;
        --psy-accent: #0f766e;
        --psy-warn: #b91c1c;
        --psy-card-bg: #ffffff;
        --psy-border: #e5e7eb;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        margin: 0;
        background: var(--psy-bg);
        color: var(--psy-fg);
        line-height: 1.55;
      }
      header.psy-header {
        padding: 20px 24px;
        background: #fff;
        border-bottom: 1px solid var(--psy-border);
        display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
      }
      header.psy-header h1 { margin: 0; font-size: 20px; }
      header.psy-header .psy-tag { color: var(--psy-muted); font-size: 13px; }
      nav.psy-nav a {
        margin-right: 12px; color: var(--psy-accent); text-decoration: none;
        font-size: 14px;
      }
      nav.psy-nav a:hover { text-decoration: underline; }
      main#app { max-width: 880px; margin: 24px auto; padding: 0 20px; }
      #view { background: var(--psy-card-bg); border: 1px solid var(--psy-border);
        border-radius: 8px; padding: 24px; min-height: 240px; }
      h2 { margin-top: 0; }
      .psy-hint { color: var(--psy-muted); font-size: 14px; }
      .psy-loading, .psy-error { color: var(--psy-muted); }
      .psy-error { color: var(--psy-warn); }
      .psy-grid {
        display: grid; gap: 16px; margin-top: 16px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .psy-card {
        border: 1px solid var(--psy-border); border-radius: 8px; padding: 16px;
        background: #fff;
      }
      .psy-card header { display: flex; justify-content: space-between; gap: 8px; }
      .psy-card h3 { margin: 0; font-size: 16px; }
      .psy-card small { color: var(--psy-muted); font-weight: normal; }
      .psy-tag {
        font-size: 12px; padding: 2px 8px; border-radius: 12px;
        background: #ecfdf5; color: var(--psy-accent); white-space: nowrap;
      }
      .psy-meta { color: var(--psy-muted); font-size: 13px; margin: 8px 0 12px; }
      .psy-warn { color: var(--psy-warn); }
      .psy-btn {
        display: inline-block; padding: 8px 16px; border-radius: 6px;
        border: 1px solid var(--psy-accent); background: #fff; color: var(--psy-accent);
        cursor: pointer; font-size: 14px;
      }
      .psy-btn:hover { background: #f0fdfa; }
      .psy-btn-primary { background: var(--psy-accent); color: #fff; }
      .psy-btn-primary:hover { background: #0d9488; }
      .psy-items { list-style: none; padding: 0; }
      .psy-item {
        padding: 12px 0; border-bottom: 1px dashed var(--psy-border);
      }
      .psy-qid { font-weight: 600; margin-right: 6px; }
      .psy-opts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 12px; }
      .psy-opt { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; }
      .psy-actions { margin-top: 20px; }
      .psy-band {
        background: #f9fafb; border-radius: 6px; padding: 12px 16px; margin: 16px 0;
      }
      .psy-band h3 { margin: 0 0 6px; }
      .psy-score { font-size: 18px; }
      .psy-score strong { color: var(--psy-accent); font-size: 24px; }
      .psy-warn-box {
        background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;
        padding: 12px 16px; margin: 16px 0; color: #7f1d1d;
      }
      .psy-disclaimer {
        margin-top: 20px; padding: 12px; background: #fffbeb;
        border-left: 3px solid #f59e0b; font-size: 13px; color: #78350f;
      }
      .psy-breakdown { font-size: 14px; color: var(--psy-muted); }
      details summary { cursor: pointer; color: var(--psy-accent); margin-top: 12px; }

      /* 情绪打卡页(Phase 1 #2 · 0911 T3) */
      .psy-checkin-home, .psy-checkin-form, .psy-checkin-saved { max-width: 720px; }
      .psy-field { margin: 18px 0; }
      .psy-field > label { display: block; margin-bottom: 8px; }
      .psy-slider-row { display: flex; align-items: center; gap: 16px; }
      .psy-slider-row input[type=range] { flex: 1; }
      .psy-valence-label { font-size: 18px; font-weight: 600; min-width: 60px; color: var(--psy-accent); }
      .psy-tag-group { border: 1px solid var(--psy-border); border-radius: 8px; padding: 12px 16px; margin: 10px 0; }
      .psy-tag-group legend { padding: 0 6px; font-weight: 600; font-size: 14px; }
      .psy-cat-block { margin: 10px 0; }
      .psy-cat-block h4 { margin: 6px 0; font-size: 14px; }
      .psy-cat-block h4 small { color: var(--psy-muted); font-weight: normal; margin-left: 6px; }
      .psy-tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .psy-tag-chip {
        --chip-bg: #e5e7eb;
        padding: 4px 10px; border-radius: 14px; border: 1px solid var(--psy-border);
        background: var(--chip-bg); color: #1f2937; font-size: 13px; cursor: pointer;
        transition: transform .08s ease;
      }
      .psy-tag-chip small { opacity: .7; margin-left: 2px; }
      .psy-tag-chip:hover { transform: scale(1.05); }
      .psy-tag-chip-on { outline: 2px solid var(--psy-accent); outline-offset: 2px; }
      .psy-counter { font-size: 12px; color: var(--psy-muted); text-align: right; margin-top: 4px; }
      textarea#psy-note {
        width: 100%; padding: 10px; border: 1px solid var(--psy-border);
        border-radius: 6px; font: inherit; font-size: 14px; resize: vertical;
      }
      .psy-log-list { list-style: none; padding: 0; margin: 12px 0; }
      .psy-log-item {
        display: grid; grid-template-columns: 110px 80px 1fr; gap: 12px;
        padding: 8px 12px; border-bottom: 1px dashed var(--psy-border); font-size: 14px;
        align-items: center;
      }
      .psy-log-date { color: var(--psy-muted); font-family: ui-monospace, SFMono-Regular, monospace; }
      .psy-chip {
        display: inline-block; padding: 2px 8px; border-radius: 10px;
        font-size: 12px; background: #e5e7eb; color: #1f2937; margin-right: 4px;
      }
      .psy-muted { color: var(--psy-muted); }
    </style>
  </head>
  <body>
    <header class="psy-header">
      <h1>心理顾问 · Web App</h1>
      <span class="psy-tag">Phase 1 · 测评 + 打卡(0910 + 0911)</span>
      <nav class="psy-nav">
        <a href="#/checkin">情绪打卡</a>
        <a href="#/scales">测评</a>
      </nav>
    </header>
    <main id="app">
      <section id="view">
        <p class="psy-loading">页面加载中…</p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
