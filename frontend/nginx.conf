# PsychologyAdvisor · frontend nginx 配置
#
# Phase 1 #8 Docker Compose(0918 T3 立)· 反代 backend:8000
#   - /                → 静态文件(frontend/index.html + src/)
#   - /api/*           → 反代 http://backend:8000
#   - /auth/*          → 反代 http://backend:8000
#   - /openapi.json    → 反代 http://backend:8000(便于 codegen)
#   - /docs            → 反代 http://backend:8000(Swagger UI)
#   - /health          → 反代 http://backend:8000
#
# frontend 是纯 hash 路由(#/),不需要 SPA fallback,但 SPA 路径 / 不带 # 时仍要兜底
#   → 任何 404 在 / 下兜回 index.html(0917 起的 hash 路由由前端 router.js 处理)

server {
    listen 8080;
    server_name _;

    # 静态文件根
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积:日记密文很小,但放宽到 1MB 留 buffer
    client_max_body_size 1m;

    # 默认 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 日志:容器内 stdout/stderr 即可
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ------------------------------------------------------------------
    # 反代 backend:8000
    # ------------------------------------------------------------------
    # FastAPI 端点统一反代(/api/* + /auth/* + /openapi.json + /docs + /health)
    # backend 是 docker compose 内 service name,docker network 自动 DNS 解析

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接不超时(预留,Phase 2 可能加流式解读)
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
    }

    location = /docs {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # ------------------------------------------------------------------
    # 静态文件 + hash 路由兜底
    # ------------------------------------------------------------------
    # 0909-0917 起的 hash 路由由 frontend/src/router.js 处理
    # (#/scales / #/checkin / #/calendar / #/articles / #/login 等)
    # nginx 层只需把不存在的路径兜回 index.html,前端 hash 路由接管

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存策略:静态资源 1h,index.html 不缓存(便于迭代)
    location ~* \.(js|css|svg|png|jpg|jpeg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}